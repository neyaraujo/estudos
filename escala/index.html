<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Escala de Plantão 24x72</title>

    <meta name="description" content="Sistema para geração automática de escala de plantão 24x72.">

    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/form.css">
    <link rel="stylesheet" href="css/table.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="page">

    <!-- ====================================================== -->
    <!-- HEADER -->
    <!-- ====================================================== -->

    <header class="page__header">

        <div class="page__container">

            <div class="header">

                <div class="header__content">

                    <h1 class="header__title">
                        Escala de Plantão 24x72
                    </h1>

                    <p class="header__description">
                        Gere automaticamente escalas mensais de trabalho para equipes de plantão.
                    </p>

                </div>

            </div>

        </div>

    </header>

    <!-- ====================================================== -->
    <!-- MAIN -->
    <!-- ====================================================== -->

    <main class="page__main">

        <div class="page__container">

            <section class="schedule">

                <!-- ========================================== -->
                <!-- CONFIGURAÇÃO -->
                <!-- ========================================== -->

                <article class="schedule__panel">

                    <div class="schedule-form">

                        <h2 class="schedule-form__title">
                            Configuração da Escala
                        </h2>

                        <form id="scheduleForm" class="schedule-form__form">

                            <!-- Funcionário 1 -->

                            <div class="schedule-form__group">

                                <label class="schedule-form__label" for="employee1">
                                    Funcionário 1
                                </label>

                                <input
                                    class="schedule-form__input"
                                    type="text"
                                    id="employee1"
                                    placeholder="Nome do funcionário">

                            </div>

                            <!-- Funcionário 2 -->

                            <div class="schedule-form__group">

                                <label class="schedule-form__label" for="employee2">
                                    Funcionário 2
                                </label>

                                <input
                                    class="schedule-form__input"
                                    type="text"
                                    id="employee2"
                                    placeholder="Nome do funcionário">

                            </div>

                            <!-- Funcionário 3 -->

                            <div class="schedule-form__group">

                                <label class="schedule-form__label" for="employee3">
                                    Funcionário 3
                                </label>

                                <input
                                    class="schedule-form__input"
                                    type="text"
                                    id="employee3"
                                    placeholder="Nome do funcionário">

                            </div>

                            <!-- Funcionário 4 -->

                            <div class="schedule-form__group">

                                <label class="schedule-form__label" for="employee4">
                                    Funcionário 4
                                </label>

                                <input
                                    class="schedule-form__input"
                                    type="text"
                                    id="employee4"
                                    placeholder="Nome do funcionário">

                            </div>

                            <!-- Data Inicial -->

                            <div class="schedule-form__group">

                                <label class="schedule-form__label" for="startDate">
                                    Data inicial da escala
                                </label>

                                <input
                                    class="schedule-form__input"
                                    type="date"
                                    id="startDate">

                            </div>

                            <!-- Mês -->

                            <div class="schedule-form__group">

                                <label class="schedule-form__label" for="month">
                                    Mês
                                </label>

                                <select
                                    class="schedule-form__select"
                                    id="month">

                                    <option value="">Selecione</option>

                                </select>

                            </div>

                            <!-- Ano -->

                            <div class="schedule-form__group">

                                <label class="schedule-form__label" for="year">
                                    Ano
                                </label>

                                <select
                                    class="schedule-form__select"
                                    id="year">

                                </select>

                            </div>

                            <!-- Botões -->

                            <div class="schedule-form__actions">

                                <button
                                    type="submit"
                                    class="schedule-form__button schedule-form__button--primary">

                                    Gerar Escala

                                </button>

                                <button
                                    type="reset"
                                    class="schedule-form__button schedule-form__button--secondary">

                                    Limpar

                                </button>

                            </div>

                        </form>

                    </div>

                </article>

                <!-- ========================================== -->
                <!-- RESULTADO -->
                <!-- ========================================== -->

                <article class="schedule__content">

                    <div class="schedule-table">

                        <div class="schedule-table__header">

                            <h2 class="schedule-table__title">
                                Escala Mensal
                            </h2>

                            <div class="schedule-table__actions">

                                <button
                                    id="printSchedule"
                                    class="schedule-table__button">

                                    Imprimir

                                </button>

                            </div>

                        </div>

                        <div class="schedule-table__body">

                            <table class="schedule-table__table">

                                <thead class="schedule-table__head">

                                    <tr>

                                        <th>Data</th>

                                        <th>Dia</th>

                                        <th>Funcionário</th>

                                    </tr>

                                </thead>

                                <tbody
                                    id="scheduleTableBody"
                                    class="schedule-table__tbody">

                                    <tr>

                                        <td colspan="3">

                                            Nenhuma escala foi gerada.

                                        </td>

                                    </tr>

                                </tbody>

                            </table>

                        </div>

                    </div>

                </article>

            </section>

        </div>

    </main>

    <!-- ====================================================== -->
    <!-- FOOTER -->
    <!-- ====================================================== -->

    <footer class="page__footer">

        <div class="page__container">

            <p class="footer__text">

                © 2026 - Sistema de Escala 24x72

            </p>

        </div>

    </footer>

    <!-- JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/employee.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
