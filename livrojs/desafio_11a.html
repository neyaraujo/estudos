<meta charset="UTF-8">

<script>
    // Elaborar um programa que leia um númemro. Calcule e informe os seus vizinhos, ou seja, o número anterior e posterior
    var numero = Number(prompt("Digite um número"));
    var anterior = numero - 1;
    var posterior = numero + 1;

    alert("O número escolhido é " + numero + "\nO numero anterior é: " + anterior + "\nO numero posterior é: " + posterior);
    
</script>
