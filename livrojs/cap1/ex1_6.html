<meta charset="utf-8">
<script>
    // Elaborar um programa que leia um número. Calcule e infome o dobro desse numero
    // Entrada de dados: ler um número
    // Processamento: calcular o dobro
    // Saída: informar o dobro

    // lè um dado de entrada
    var num = prompt("Digite um número")
    // cacula o dobro
    var dobro = num * 2;
    // exibe a resposta
    alert("O Dobro é " + dobro);

</script>
