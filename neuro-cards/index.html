<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Cards</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game">

        <!-- Cabeçalho -->
        <header class="game__header">

            <h1 class="game__title">
                Memory Cards
            </h1>

            <div class="game__stats">

                <article class="game__stat">
                    <span class="game__stat-label">Rodada</span>
                    <strong class="game__stat-value" id="round">0</strong>
                </article>

                <article class="game__stat">
                    <span class="game__stat-label">Pontuação</span>
                    <strong class="game__stat-value" id="score">0</strong>
                </article>

                <article class="game__stat">
                    <span class="game__stat-label">Recorde</span>
                    <strong class="game__stat-value" id="best-score">0</strong>
                </article>

            </div>

        </header>

        <!-- Área principal -->
        <section class="game__board">

            <div class="game__cards" id="cards">

                <button
                    class="game__card game__card--red"
                    data-card="0"
                    aria-label="Carta Vermelha">
                </button>

                <button
                    class="game__card game__card--blue"
                    data-card="1"
                    aria-label="Carta Azul">
                </button>

                <button
                    class="game__card game__card--green"
                    data-card="2"
                    aria-label="Carta Verde">
                </button>

                <button
                    class="game__card game__card--yellow"
                    data-card="3"
                    aria-label="Carta Amarela">
                </button>

                <button
                    class="game__card game__card--purple"
                    data-card="4"
                    aria-label="Carta Roxa">
                </button>

            </div>

        </section>

        <!-- Mensagens -->
        <section class="game__feedback">

            <h2
                class="game__message"
                id="message">
                Clique em "Iniciar Jogo"
            </h2>

        </section>

        <!-- Tela Inicial -->
        <section
            class="game__overlay game__overlay--visible"
            id="start-screen">

            <div class="game__modal">

                <h2 class="game__modal-title">
                    Memory Cards
                </h2>

                <p class="game__modal-text">
                    Memorize a sequência apresentada pelas cartas e repita exatamente na mesma ordem.
                    A cada rodada uma nova carta será adicionada.
                </p>

                <button
                    class="game__button"
                    id="start-button">
                    Iniciar Jogo
                </button>

            </div>

        </section>

        <!-- Game Over -->
        <section
            class="game__overlay"
            id="game-over-screen">

            <div class="game__modal">

                <h2 class="game__modal-title">
                    Game Over
                </h2>

                <p class="game__modal-text">
                    Você errou a sequência.
                </p>

                <div class="game__results">

                    <p class="game__result">
                        Rodada:
                        <strong id="final-round">0</strong>
                    </p>

                    <p class="game__result">
                        Pontuação:
                        <strong id="final-score">0</strong>
                    </p>

                    <p class="game__result">
                        Recorde:
                        <strong id="final-best-score">0</strong>
                    </p>

                </div>

                <button
                    class="game__button"
                    id="restart-button">
                    Jogar Novamente
                </button>

            </div>

        </section>

    </main>

    <script src="js/parte1.js"></script>
    <script src="js/parte2.js"></script>
    <script src="js/parte3.js"></script>

</body>
</html>
