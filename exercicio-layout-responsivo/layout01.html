<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loyout - 01</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        ul {
            list-style: none;  
        }
        
        a {
            text-decoration: none;
        }
    
        body {
            background: rgb(182, 182, 182);
        }
        header {
            background: #fff;
        }
        header nav {
            padding: 3px;

            display: flex;
            justify-content: space-between;
            align-items: center;

            max-width: 800px;
            margin: 0 auto;
        }

        nav ul {
            display: flex;
            gap: 20px;
        }
        nav li {
            background: darkcyan;
            padding: 5px;
        }

        .menu {
            
        }
        @media(max-width:700px){
            header nav {
                background: green;
                display: flex;
                flex-direction: row;
                justify-content: flex-start;
                align-items: center;
            }
            header nav .menu{
                

            }

            .menu {
                background: gray;
                order: 2;
            }

            nav ul {
                position: fixed;
                top: 50px;
                order: 3;
                flex-direction: column;
                display: none;
            }
            
            nav {
                display: flex;
                flex-direction: column;
            }
            nav .logo {
                order: 1;
                align-self: flex-start;

            }

            

        }


    </style>
</head>
<body>
    <header>
        <nav class="navigation">
            <a class="logo" href="#">Logo</a>
            <ul>
                <li class="item"><a href="#">about</a></li>
                <li class="item"><a href="#">about</a></li>
                <li class="item"><a href="#">about</a></li>
            </ul>
            <div class="menu">
                <span>&#926</span>
            </div>
        </nav>
    </header>

</body>
</html>
