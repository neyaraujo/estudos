<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lógica da rifa</title>

    <style>
        #botoes {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;

            padding: 0;
            margin: 20px auto;
            max-width: 600px;

            list-style: none;
        }

        #botoes li {
            display: flex;
        }

        #botoes button {
            width: 100%;
            padding: 10px 5px;

            font-size: 12px;
            font-weight: bold;

            cursor: pointer;

        }
    </style>
</head>
<body>
    
    <h1>Lógica do Programa</h1>

    <ul id="botoes">

    </ul>

    <br>
    <br>

    <form action="" name="formulario" id="formulario">
        <label for="nome">Digite seu nome:</label><br>
        <input type="text" name="nome" id="nome">
        <br>
        <br>
        <label for="telefone">phone</label><br>
        <input type="tel" name="telefone" id="telefone">
        <br>
        <br>
        <input type="submit" value="enviar">
    </form>

    <p id="resultado">Aqui vai o texto</p>


    <script>

const resultado = document.getElementById("resultado");
const formulario = document.getElementById("formulario");
const lista  = document.getElementById("botoes");


criarBotoes()

function criarBotoes() {
    for (let numero = 1; numero <= 100; numero++) {
        const li = document.createElement("li");
        const botao = document.createElement("button");

        botao.type = "button";
        botao.value = numero;
        botao.innerText = numero;

        li.appendChild(botao);
        lista.appendChild(li);
    }
}


    </script>
</body>
</html>
