<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sandbox</title>
    <link rel="stylesheet" href="responsive.css">
    <link rel="stylesheet" href="base.css">
    <style>
.menu{
    position: fixed;
    top: 0;
    left: 0;

    width: 280px;
    height: 100vh;

    background: white;

    transform: translateX(-100%);
    transition: .35s;

    z-index: 1000;
}

.menu--active{
    transform: translateX(0);
}

.menu__overlay{

    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.45);

    opacity: 0;
    visibility: hidden;

    transition: .35s;

    z-index: 999;
}

.menu__overlay--active{

    opacity: 1;
    visibility: visible;

}


    </style>
</head>
<body>
<header class="header">

    <button
        class="header__menu-button"
        type="button"
        aria-label="Abrir menu"
        aria-expanded="false">

        ☰

    </button>

    <a class="header__logo" href="#">
        <img src="../img/logo-eletrica.png" alt="Logo" width="75px">
    </a>
    <div class="header__actions"></div>

</header>

<nav class="menu">

    <button
        class="menu__close-button"
        type="button"
        aria-label="Fechar menu">

        ✕

    </button>

    <ul class="menu__list">

        <li class="menu__item">
            <a class="menu__link" href="#">Início</a>
        </li>

        <li class="menu__item">
            <a class="menu__link" href="#">Produtos</a>
        </li>

        <li class="menu__item">
            <a class="menu__link" href="#">Contato</a>
        </li>

    </ul>

</nav>

<div class="menu__overlay"></div>
    <style>

        .hidden {
            display: none;
        }
        .tracking__list {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            list-style: none;

            font-size: 30px;

            

        }
        .tracking__list__item {
            
        }
        .tracking__item a {
            text-decoration: none;
            font-weight: bold;
            
            color: rgb(0, 78, 203);
           text-shadow: 3px 3px 3px #00000023;
        }
        .tracking__title {
            color: rgb(0, 78, 203);
           text-shadow: 3px 3px 3px #00000023;
        }
    </style>

    <main class="main">
        <section class="tracking">
            <h2 class="tracking__title">Contatos</h2>
            <ul class="tracking__list">
                <li class="tracking__item"><a>(98) 98869-4349</a></li>
                <li class="tracking__item"><a>(98) 98519-8401</a></li>
                <li class="tracking__item"><a href="https://www.instagram.com/dr.eletrica_reparador">@dr.eletrica_reparador</a></li>
            </ul>

            <form class="tracking__form hide hidden" action="#" method="get">

                <label class="tracking__label" for="tracking-code">
                    Código de rastreamento
                </label>

                <input
                    class="tracking__input"
                    type="text"
                    id="tracking-code"
                    name="trackingCode"
                    placeholder="Digite seu código"
                    required
                >

                <button
                    class="tracking__button"
                    type="submit">
                    Localizar
                </button>

            </form>
        </section>
        <section class="maps">

            <iframe src="https://www.google.com/maps/embed?pb=!4v1783190390288!6m8!1m7!1std8D25GOBEsm67q33LOMHQ!2m2!1d-2.521476981098133!2d-45.08017939441981!3f119.06881890451137!4f1.2995318585365965!5f0.4000000000000002" width="100%" height="300px" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

        </section>
    </main>
    <footer>
        
    </footer>


    <script>
        const menu = document.querySelector(".menu");

        const openButton = document.querySelector(".header__menu-button");

        const closeButton = document.querySelector(".menu__close-button");

        const overlay = document.querySelector(".menu__overlay");


        function openMenu(){

            menu.classList.add("menu--active");
            overlay.classList.add("menu__overlay--active");

            openButton.innerHTML = "✕";
            openButton.setAttribute("aria-expanded","true");

        }

        function closeMenu(){

            menu.classList.remove("menu--active");
            overlay.classList.remove("menu__overlay--active");

            openButton.innerHTML = "☰";
            openButton.setAttribute("aria-expanded","false");

        }


        openButton.addEventListener("click",()=>{

            menu.classList.contains("menu--active")
                ? closeMenu()
                : openMenu();

        });

        closeButton.addEventListener("click",closeMenu);

        overlay.addEventListener("click",closeMenu);
    </script>
</body>
</html>
